name: Build Homebrew repository

on:
  push:
    paths:
      - '.github/workflows/build-homebrew-repo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download official Kodi RC1 build
        shell: bash
        run: |
          set -euo pipefail
          SRC_URL='https://mirrors.kodi.tv/nightlies/webos/master/org.xbmc.kodi_20260927-28ea2eac-master_arm.ipk'
          FILE='org.xbmc.kodi_20260927-28ea2eac-master_arm.ipk'
          curl -fL --retry 5 --retry-delay 3 "$SRC_URL" -o "$FILE"
          echo "IPK_FILE=$FILE" >> "$GITHUB_ENV"
          echo "SHA256=$(sha256sum "$FILE" | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "IPK_SIZE=$(stat -c%s "$FILE")" >> "$GITHUB_ENV"

      - name: Publish IPK as GitHub release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='v22.0-rc1-webos'
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title 'Kodi 22 RC1 for webOS' --notes 'Official Team Kodi webOS RC1 build mirrored here only so Homebrew Channel can download it reliably.'
          fi
          gh release upload "$TAG" "$IPK_FILE" --clobber

      - name: Build manifest and repository index
        shell: bash
        run: |
          set -euo pipefail
          IPK_URL="https://github.com/nuronixit-web/webos-kodi-rc1/releases/download/v22.0-rc1-webos/$IPK_FILE"
          ICON_URL='https://raw.githubusercontent.com/xbmc/xbmc/master/tools/webOS/packaging/icon.png'
          MANIFEST_URL='https://raw.githubusercontent.com/nuronixit-web/webos-kodi-rc1/main/org.xbmc.kodi.manifest.json'

          cat > org.xbmc.kodi.manifest.json <<EOF
          {
            "id": "org.xbmc.kodi",
            "version": "21.90.901",
            "type": "native",
            "title": "Kodi 22 RC1",
            "appDescription": "Kodi 22 Piers RC1 for webOS, official Team Kodi build from commit 28ea2eac.",
            "iconUri": "$ICON_URL",
            "sourceUrl": "https://github.com/xbmc/xbmc",
            "rootRequired": false,
            "ipkUrl": "$IPK_URL",
            "ipkHash": {
              "sha256": "$SHA256"
            },
            "ipkSize": $IPK_SIZE
          }
          EOF

          cat > repo.json <<EOF
          {
            "paging": {
              "page": 1,
              "count": 1,
              "maxPage": 1,
              "itemsTotal": 1
            },
            "packages": [
              {
                "id": "org.xbmc.kodi",
                "title": "Kodi 22 RC1",
                "iconUri": "$ICON_URL",
                "manifestUrl": "$MANIFEST_URL"
              }
            ]
          }
          EOF

      - name: Commit generated files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add org.xbmc.kodi.manifest.json repo.json
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Use GitHub release asset for Kodi 22 RC1'
          git push
